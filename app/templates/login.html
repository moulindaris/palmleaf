<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PalmLeaf AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+Tamil:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
{% include "partials/nav.html" %}

<main class="container" style="max-width:520px;padding-top:3rem">
  <div class="card">
    <h2 style="font-family:'Cinzel',serif;color:var(--text-gold);text-align:center;margin-bottom:0.5rem">🔑 User Login</h2>
    <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem">Access your researcher or historian account</p>

    {% if error %}
    <div style="background:rgba(239, 68, 68, 0.15);border:1px solid rgba(239,68,68,0.4);color:#f87171;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-size:0.9rem">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group" style="margin-bottom:1rem">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. researcher_moulin" required />
      </div>
      <div class="form-group" style="margin-bottom:1.5rem">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" style="width:100%">🔓 Sign In</button>
    </form>

    <div style="display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--text-dim);font-size:.82rem">
      <span style="height:1px;flex:1;background:var(--border-gold)"></span>
      <span>or</span>
      <span style="height:1px;flex:1;background:var(--border-gold)"></span>
    </div>
    <form method="POST" action="/login">
      <input type="hidden" name="mode" value="guest" />
      <button type="submit" class="btn-secondary" style="width:100%">Continue as Guest — no password</button>
    </form>

    <div style="margin-top:1.5rem;text-align:center;font-size:0.88rem;color:var(--text-muted)">
      Don't have an account? <a href="/register" style="color:var(--text-gold);font-weight:600">Register Here</a>
    </div>

    <div style="margin-top:1.25rem;padding:0.75rem;background:rgba(245,158,11,0.05);border:1px dashed var(--border-gold);border-radius:8px;font-size:0.8rem;color:var(--text-dim)">
      💡 <strong>Default Admin Login:</strong> Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
  </div>
</main>

{% include "partials/footer.html" %}
</body>
</html>
